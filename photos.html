<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>教育現場照片｜董勳遠</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/photos.css"></head><body><header class="photo-nav"><a href="index.html">← 董勳遠</a><strong>FIELD ARCHIVE <small>教育現場照片</small></strong><a href="share.html">分享 ↗</a></header><main><section class="photo-intro"><p class="eyebrow">FIELD ARCHIVE / 05</p><h1>不是展示成果，<br><em>是記住孩子如何長大。</em></h1><p>從原始資料中重新裁切出的教育現場照片。每張照片都有一段簡短說明，讓影像回到故事裡。</p></section><section class="photo-board"><div class="filter-row"><span>瀏覽主題</span><button class="active" data-filter="all">全部</button><button data-filter="sport">運動韌性</button><button data-filter="international">國際視野</button><button data-filter="care">品格陪伴</button><button data-filter="school">學校行動</button></div><div class="photo-grid"><figure data-category="sport"><img src="images/photos/sport-01.jpg" alt="曲棍球隊訓練現場" loading="lazy"><figcaption><b>運動韌性</b><span>從訓練開始，陪孩子相信自己做得到。</span></figcaption></figure><figure data-category="sport"><img src="images/photos/sport-03.jpg" alt="學生與冠軍獎盃合影" loading="lazy"><figcaption><b>高峰經驗</b><span>冠軍不是奇蹟，是團隊每天累積的選擇。</span></figcaption></figure><figure data-category="sport"><img src="images/photos/sport-05.jpg" alt="曲棍球隊合影" loading="lazy"><figcaption><b>一起完成</b><span>把個人的努力，連成團隊的力量。</span></figcaption></figure><figure data-category="international"><img src="images/photos/international-01.jpg" alt="國家隊訓練現場" loading="lazy"><figcaption><b>國際視野</b><span>穿上代表隊球衣，也背起更大的責任。</span></figcaption></figure><figure class="wide" data-category="international"><img src="images/photos/international-03.jpg" alt="美國十六歲組冠軍團隊" loading="lazy"><figcaption><b>世界的舞台</b><span>讓偏鄉孩子看見，自己的夢想可以走得很遠。</span></figcaption></figure><figure data-category="international"><img src="images/photos/australia-04.jpg" alt="學生參訪雪梨歌劇院" loading="lazy"><figcaption><b>比賽之外</b><span>把競賽轉成人文理解與國際學習。</span></figcaption></figure><figure data-category="care"><img src="images/photos/care-01.jpg" alt="學生參與公益募款" loading="lazy"><figcaption><b>品格陪伴</b><span>日行一善，讓關懷成為可以練習的日常。</span></figcaption></figure><figure data-category="care"><img src="images/photos/care-03.jpg" alt="學生志工團隊" loading="lazy"><figcaption><b>孩子的舞台</b><span>當孩子被看重，就會開始主動承擔。</span></figcaption></figure><figure data-category="care"><img src="images/photos/filial-02.jpg" alt="孝道與品格教育活動" loading="lazy"><figcaption><b>孝德育才</b><span>從家庭、校園與社區一起培養善的循環。</span></figcaption></figure><figure class="wide" data-category="school"><img src="images/photos/eco-01.jpg" alt="生態校園夥伴計畫" loading="lazy"><figcaption><b>環境行動</b><span>把永續從口號，變成孩子親手參與的課程。</span></figcaption></figure><figure data-category="school"><img src="images/photos/eco-03.jpg" alt="生態校園成果展示" loading="lazy"><figcaption><b>學校創新</b><span>一所學校的改變，從一群人願意一起做開始。</span></figcaption></figure></div></section></main><footer>董勳遠｜教育工作者個人網站 <a href="index.html">回到首頁 ↑</a></footer><script src="js/photos.js"></script></body></html>
